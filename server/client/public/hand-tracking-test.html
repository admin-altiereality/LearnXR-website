<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LearnXR — Hand Tracking Sandbox</title>

<!--
  Hand-tracking sandbox.

  A deliberately standalone page. It lives in public/ so Vite copies it verbatim
  into dist/, and Firebase serves static files before applying the SPA rewrite —
  so it is reachable over HTTPS at /hand-tracking-test.html without a route, a
  build step, or any contact with the React app.

  That isolation is the point. Three.js is loaded from a CDN here, which is fine
  on a page that has no other copy of it. Doing the same INSIDE the app would
  load a second Three.js alongside the bundled one, and objects made by one are
  not recognised by the other — scene graph, raycasting and instanceof all break.
  When this interaction is ported into XRLessonPlayerV3 it will use the bundled
  three@0.159.0, which already ships XRButton, OculusHandModel and
  XRHandModelFactory. Only gestures.js moves across; nothing below does.
-->

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    overflow: hidden;
    background: #05080d;
    color: #e6edf5;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Readout. Visible on the flat page and, because it is DOM, NOT visible in the
     headset — the in-scene panel below is what you read while immersed. */
  #hud {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 10;
    max-width: 22rem;
    padding: 0.9rem 1.1rem;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 12px;
    background: rgba(8, 13, 19, 0.85);
    backdrop-filter: blur(12px);
    font-size: 0.85rem;
    line-height: 1.5;
  }
  #hud h1 { margin: 0 0 0.35rem; font-size: 0.95rem; letter-spacing: -0.01em; }
  #hud p { margin: 0 0 0.6rem; color: #8a9aab; font-size: 0.8rem; }
  .hand-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.4rem; }
  .hand-row span:first-child { width: 3.2rem; color: #8a9aab; font-size: 0.75rem; }
  .meter { flex: 1; height: 6px; border-radius: 999px; background: rgba(148, 163, 184, 0.2); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0%; background: #22d3ee; transition: width 60ms linear; }
  .meter.grabbing i { background: #34d399; }
  .value { width: 2.6rem; text-align: right; font-variant-numeric: tabular-nums; font-size: 0.75rem; }
  #status { margin-top: 0.7rem; padding-top: 0.6rem; border-top: 1px solid rgba(148,163,184,0.18); color: #8a9aab; font-size: 0.75rem; }
</style>
</head>
<body>

<div id="hud">
  <h1>Hand Tracking Sandbox</h1>
  <p>Enter XR, then pinch near a shape to pick it up. Release to leave it in place.</p>
  <div class="hand-row">
    <span>Left</span>
    <div class="meter" id="meter-left"><i></i></div>
    <span class="value" id="value-left">0.00</span>
  </div>
  <div class="hand-row">
    <span>Right</span>
    <div class="meter" id="meter-right"><i></i></div>
    <span class="value" id="value-right">0.00</span>
  </div>
  <div id="status">Loading…</div>
</div>

<!--
  One import map, one Three.js version for BOTH the core and the addons.
  Addons import bare "three" internally; without this map they would resolve a
  different copy than the page does, which is the single most common way these
  demos fail — silently, with hands that never appear.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRButton } from 'three/addons/webxr/XRButton.js';
import { OculusHandModel } from 'three/addons/webxr/OculusHandModel.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { createGestureTracker } from './hand-tracking/gestures.js';

const status = document.getElementById('status');
const setStatus = (text) => { status.textContent = text; };

// ---------------------------------------------------------------------------
// Renderer, scene, camera
// ---------------------------------------------------------------------------

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
// A little fog so the room reads as having depth rather than being a void.
scene.fog = new THREE.Fog(0x0b1220, 4, 14);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 50);
// Only used before entering XR; in a session the headset supplies the pose.
camera.position.set(0, 1.6, 0.6);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/*
  hand-tracking is OPTIONAL, not required.

  Requesting it as a required feature makes requestSession reject outright on any
  headset that cannot offer it — including a Quest with hand tracking switched
  off in settings — so the user simply cannot enter XR. Optional means hands work
  where they are available and controllers work everywhere else, which is what a
  classroom of mixed hardware needs.

  local-floor IS required: without a floor-relative space the desk below would be
  positioned relative to the headset rather than the room.
*/
document.body.appendChild(
  XRButton.createButton(renderer, {
    requiredFeatures: ['local-floor'],
    optionalFeatures: ['hand-tracking'],
  })
);

// ---------------------------------------------------------------------------
// Room: floor, desk, and the shapes to pick up
// ---------------------------------------------------------------------------

scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x14202e, 1.1));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(2, 4, 2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.setScalar(1024);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 12;
scene.add(keyLight);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(6, 48),
  new THREE.MeshStandardMaterial({ color: 0x121c28, roughness: 0.95 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/*
  One alignment grid for the whole scene.

  Every position below derives from these four numbers rather than being placed
  by eye, so the desk, the shapes and the panel share a centre line and a common
  depth. Reach and height are chosen for a SEATED adult: a demo you have to lean
  or stand for tells you nothing about how the interaction actually feels.
*/
const DESK_HEIGHT = 0.75;   // standard desk, metres
const DESK_DEPTH = -0.45;   // arm's length in front of the viewer
const DESK_WIDTH = 1.2;
const SHAPE_LIFT = 0.09;    // clears the desk surface for every shape equally

const desk = new THREE.Mesh(
  new THREE.BoxGeometry(DESK_WIDTH, 0.04, 0.6),
  new THREE.MeshStandardMaterial({ color: 0x24425c, roughness: 0.6, metalness: 0.1 })
);
desk.position.set(0, DESK_HEIGHT, DESK_DEPTH);
desk.castShadow = true;
desk.receiveShadow = true;
scene.add(desk);

/** Everything a hand is allowed to pick up. */
const grabbables = [];

/**
 * Place a shape in slot `index` of `count`, evenly spaced across the desk.
 *
 * Computing the spacing rather than hard-coding four x values means the row
 * stays centred and evenly divided whatever is added or removed.
 */
function addShape(geometry, color, index, count) {
  const usable = DESK_WIDTH - 0.24;                    // margin at each end
  const step = usable / (count - 1);
  const x = -usable / 2 + index * step;

  const mesh = new THREE.Mesh(
    geometry,
    new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.15 })
  );
  mesh.position.set(x, DESK_HEIGHT + SHAPE_LIFT, DESK_DEPTH);
  mesh.castShadow = true;
  // Kept so a grabbed shape can be restored to its resting tint on release.
  mesh.userData.baseColor = new THREE.Color(color);
  scene.add(mesh);
  grabbables.push(mesh);
  return mesh;
}

// Sized to a common visual weight so the row reads as a set rather than as
// four unrelated objects that happen to share a table.
const SHAPES = [
  [new THREE.BoxGeometry(0.1, 0.1, 0.1), 0x22d3ee],
  [new THREE.IcosahedronGeometry(0.068, 0), 0xf59e0b],
  [new THREE.TorusKnotGeometry(0.045, 0.016, 72, 12), 0xa855f7],
  [new THREE.CylinderGeometry(0.048, 0.048, 0.12, 24), 0x34d399],
];
SHAPES.forEach(([geometry, color], index) => addShape(geometry, color, index, SHAPES.length));

// In-headset readout. The DOM HUD is invisible in a session, so the numbers you
// need while immersed have to be geometry.
const panelCanvas = document.createElement('canvas');
panelCanvas.width = 512;
panelCanvas.height = 192;
const panelCtx = panelCanvas.getContext('2d');
const panelTexture = new THREE.CanvasTexture(panelCanvas);
const panel = new THREE.Mesh(
  new THREE.PlaneGeometry(0.5, 0.1875),
  new THREE.MeshBasicMaterial({ map: panelTexture, transparent: true })
);
// Squared to the desk: same centre line, set back from the front edge, and
// tilted to face a seated viewer rather than standing vertical.
panel.position.set(0, DESK_HEIGHT + 0.44, DESK_DEPTH - 0.28);
panel.rotation.x = -0.18;
scene.add(panel);

function drawPanel(left, right) {
  const ctx = panelCtx;
  ctx.clearRect(0, 0, 512, 192);
  ctx.fillStyle = 'rgba(8, 13, 19, 0.9)';
  ctx.fillRect(0, 0, 512, 192);
  ctx.strokeStyle = 'rgba(34, 211, 238, 0.5)';
  ctx.lineWidth = 3;
  ctx.strokeRect(2, 2, 508, 188);

  ctx.fillStyle = '#e6edf5';
  ctx.font = '600 26px system-ui, sans-serif';
  ctx.fillText('Pinch strength', 24, 44);

  const row = (label, state, y) => {
    ctx.fillStyle = '#8a9aab';
    ctx.font = '400 20px system-ui, sans-serif';
    ctx.fillText(label, 24, y);
    ctx.fillStyle = 'rgba(148,163,184,0.25)';
    ctx.fillRect(120, y - 14, 300, 12);
    ctx.fillStyle = state.pinching ? '#34d399' : '#22d3ee';
    ctx.fillRect(120, y - 14, 300 * state.pinchStrength, 12);
    ctx.fillStyle = '#e6edf5';
    ctx.font = '500 20px system-ui, sans-serif';
    ctx.fillText(state.pinchStrength.toFixed(2), 440, y);
  };

  row('Left', left, 100);
  row('Right', right, 150);
  panelTexture.needsUpdate = true;
}

// ---------------------------------------------------------------------------
// Hands and controllers
// ---------------------------------------------------------------------------

const controllerModelFactory = new XRControllerModelFactory();

/**
 * One entry per input slot. Hands and controllers coexist: the runtime supplies
 * whichever the user is actually holding, and unused ones simply never report
 * joints, so nothing has to be switched off.
 */
const hands = [0, 1].map((index) => {
  const hand = renderer.xr.getHand(index);
  hand.add(new OculusHandModel(hand));
  scene.add(hand);

  // Controllers, so the page is still usable when hands are unavailable.
  const grip = renderer.xr.getControllerGrip(index);
  grip.add(controllerModelFactory.createControllerModel(grip));
  scene.add(grip);

  const controller = renderer.xr.getController(index);
  scene.add(controller);

  return {
    index,
    hand,
    controller,
    tracker: createGestureTracker(),
    /** The shape currently held, and the offset that keeps it from jumping. */
    held: null,
    heldOffset: new THREE.Vector3(),
  };
});

renderer.xr.addEventListener('sessionstart', () => setStatus('In XR — pinch to grab.'));
renderer.xr.addEventListener('sessionend', () => {
  setStatus('Session ended.');
  // Never leave a shape parented to a hand that no longer exists.
  hands.forEach(releaseHeld);
});

// ---------------------------------------------------------------------------
// Grabbing
// ---------------------------------------------------------------------------

/** How close a pinch has to be to a shape's centre to pick it up. */
const GRAB_REACH_M = 0.12;

function nearestGrabbable(point) {
  let best = null;
  let bestDistance = GRAB_REACH_M;
  for (const mesh of grabbables) {
    // Held by the other hand already — leave it alone rather than fighting over it.
    if (mesh.userData.heldBy !== undefined) continue;
    const distance = mesh.position.distanceTo(point);
    if (distance < bestDistance) {
      best = mesh;
      bestDistance = distance;
    }
  }
  return best;
}

function grabAt(slot, point) {
  const mesh = nearestGrabbable(point);
  if (!mesh) return;

  slot.held = mesh;
  mesh.userData.heldBy = slot.index;
  /*
    Store the offset rather than reparenting the mesh onto the hand.

    Reparenting inherits the hand's transform, which on a tracked hand includes
    scale and rotation the object should not take on — the shape visibly jumps
    and skews the moment it is picked up. Carrying an offset keeps the object in
    world space, exactly as the user last saw it.
  */
  slot.heldOffset.copy(mesh.position).sub(point);
  mesh.material.emissive = new THREE.Color(0x22d3ee);
  mesh.material.emissiveIntensity = 0.4;
}

function releaseHeld(slot) {
  if (!slot.held) return;
  slot.held.material.emissiveIntensity = 0;
  delete slot.held.userData.heldBy;
  // Left exactly where it is. No physics, no snapping back.
  slot.held = null;
}

// ---------------------------------------------------------------------------
// Frame loop
// ---------------------------------------------------------------------------

const hudMeters = {
  0: { bar: document.querySelector('#meter-left i'), meter: document.getElementById('meter-left'), value: document.getElementById('value-left') },
  1: { bar: document.querySelector('#meter-right i'), meter: document.getElementById('meter-right'), value: document.getElementById('value-right') },
};

const frameState = [null, null];

renderer.setAnimationLoop(() => {
  for (const slot of hands) {
    const state = slot.tracker.update(slot.hand, THREE);
    frameState[slot.index] = state;

    if (state.justPinched && state.pinchPoint) {
      grabAt(slot, state.pinchPoint);
    } else if (state.justReleased) {
      releaseHeld(slot);
    }

    // Follow the pinch while it is held.
    if (slot.held && state.pinching && state.pinchPoint) {
      slot.held.position.copy(state.pinchPoint).add(slot.heldOffset);
    }

    // Flat-screen readout.
    const hud = hudMeters[slot.index];
    if (hud) {
      hud.bar.style.width = `${(state.pinchStrength * 100).toFixed(0)}%`;
      hud.meter.classList.toggle('grabbing', state.pinching);
      hud.value.textContent = state.pinchStrength.toFixed(2);
    }
  }

  // Idle spin for anything not being held, so the scene reads as live.
  for (const mesh of grabbables) {
    if (mesh.userData.heldBy === undefined) mesh.rotation.y += 0.004;
  }

  drawPanel(
    frameState[0] || { pinchStrength: 0, pinching: false },
    frameState[1] || { pinchStrength: 0, pinching: false }
  );

  renderer.render(scene, camera);
});

// ---------------------------------------------------------------------------
// Capability report — says plainly why hands might not appear
// ---------------------------------------------------------------------------

if (!navigator.xr) {
  setStatus('WebXR unavailable. Open this page in the Meta Quest browser.');
} else {
  navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
    setStatus(
      supported
        ? 'Ready — press ENTER XR. Hands appear if hand tracking is enabled on the device.'
        : 'immersive-vr not supported by this browser.'
    );
  });
}
</script>
</body>
</html>
