<!DOCTYPE html>
<html>
<head>
	<title>krpano - shot-panoramic-composition-living-room</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
	<style>
		html { height:100%; }
		body { height:100%; overflow:hidden; margin:0; padding:0; font-family:Arial, Helvetica, sans-serif; font-size:16px; color:#FFFFFF; background-color:#000000; }
	</style>
</head>
<body>

<script src="tour.js"></script>

<div style="width:100%;height:100%;">
	<noscript><table style="width:100%;height:100%;"><tr style="vertical-align:middle;text-align:center;"><td>ERROR:<br><br>Javascript not activated<br><br></td></tr></table></noscript>
	<script>
		var krpanoInterface = null;

		function pauseVideoIfPlaying() {
			if (!krpanoInterface) return;
			krpanoInterface.call("if(plugin[video], plugin[video].pause(); );");
		}

		function handleVisibilityChange() {
			if (document.hidden) {
				pauseVideoIfPlaying();
			}
		}

		window.addEventListener("blur", pauseVideoIfPlaying);
		window.addEventListener("pagehide", pauseVideoIfPlaying);
		document.addEventListener("visibilitychange", handleVisibilityChange);

		function onKrpanoReady(krpano) {
			krpanoInterface = krpano;
		}

		embedpano({xml:"tour.xml", passQueryParameters:"startscene,startlookat", onready:onKrpanoReady});
	</script>
</div>

</body>
</html>
